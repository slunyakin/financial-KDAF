[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-kdaf"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Auth
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    # Knowledge graph
    "neo4j>=5.20",
    # Data connectors
    "asyncpg>=0.29",        # Postgres demo connector
    "redis[hiredis]>=5.0",  # Cache
    # Solver dependencies (allowed in sandbox)
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = [
    "S101",  # assert statements allowed in tests
    "S102",  # exec allowed in sandbox harness
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finance_analytics*"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
